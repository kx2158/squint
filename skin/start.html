<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squint</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action https://duckduckgo.com">
<style>
  :root { color-scheme: dark; --a: #8b7cf6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.4 system-ui, "Segoe UI", sans-serif; color: #ecebf5;
    background: radial-gradient(1200px 700px at 20% 10%, #2b2848, transparent 60%), radial-gradient(900px 600px at 90% 90%, #23304a, transparent 60%), #15141d; }
  main { width: min(640px, 92vw); padding: 28px; border-radius: 22px; background: rgba(255, 255, 255, .06); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, .1); }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: .5px; }
  p.s { margin: 0 0 18px; color: #a3a2b8; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(0, 0, 0, .25); color: inherit; font: inherit; outline: none; transition: box-shadow .2s; }
  input:focus { box-shadow: 0 0 0 2px var(--a); }
  button { padding: 0 16px; border: 0; border-radius: 12px; background: var(--a); color: #fff; font: inherit; cursor: pointer; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .g a { display: block; padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, .07); color: inherit; text-decoration: none; transition: transform .15s ease, background .15s ease; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g a:hover { background: rgba(255, 255, 255, .13); transform: translateY(-2px); }
  small { display: block; margin-top: 18px; color: #7f7e96; }
</style></head><body><main>
<h1>&gt;_&lt;</h1><p class="s">Squint, on the Tor Browser engine</p>
<form action="https://duckduckgo.com/" method="get"><input name="q" placeholder="Search privately" autofocus autocomplete="off"><button>Go</button></form>
<div class="g">@@PINS@@</div>
<small>Every site sees the same generic browser. Edit your tiles in pins.json.</small>
</main></body></html>
